<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order | PINTO LOVE</title>

<!--
  ใช้ order.html เดิมของเธอทั้งหมด
  จุดสำคัญคือส่วน submitOrder() ตอนท้าย
  ต้องมีการบันทึก receiptData ทั้ง sessionStorage และ localStorage
-->

</head>

<body>

<!--
  ให้ใช้ HTML + CSS + ระบบ Order เดิมของเธอทั้งหมดตรงนี้
-->

<script>

/*
==================================================
  จุดสำคัญที่ต้องใช้ใน submitOrder()
==================================================
*/

/*
  หลังจากสร้าง order สำเร็จแล้ว
  ให้สร้าง receiptData แบบนี้
*/

const receiptData = {
  language: currentLanguage,

  orderNumber: createdOrderNumber,

  customerName: customerName,

  lineId: normalizeLineId(lineId),

  template:
    document.getElementById("templateName").textContent,

  extras: prices.extras,

  basePrice: prices.templatePrice,

  extrasTotal: prices.extrasTotal,

  subtotal: prices.subtotal,

  discountAmount: prices.discountAmount,

  discountPercent:
    couponApplied
      ? DISCOUNT_PERCENT
      : 0,

  total: prices.total,

  deposit: prices.deposit,

  remaining: prices.remaining,

  coupon:
    couponApplied
      ? couponCodeApplied
      : "",

  createdAt:
    new Date().toISOString()
};


/*
==================================================
  สำคัญมาก
  เก็บไว้ 2 ที่ เพื่อให้หน้า Receipt อ่านได้แน่นอน
==================================================
*/

const receiptJSON =
  JSON.stringify(receiptData);


/*
  สำหรับการเปิดหน้าถัดไปทันที
*/

sessionStorage.setItem(
  "pintoReceiptData",
  receiptJSON
);


/*
  สำรองไว้ใน localStorage
*/

localStorage.setItem(
  "pintoReceiptData",
  receiptJSON
);


/*
  ไปหน้าเครื่องปริ้น
*/

window.location.href =
  "order-success.html";

</script>

</body>
</html>
```
