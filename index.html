<html lang="th">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PINTO STUDIO | Digital Experiences</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&family=Noto+Serif+Thai:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --taupe:#8C7E74;
  --warm:#C8BCB1;
  --beige:#E6DED8;
  --cream:#F4EFEA;

  --dark:#403934;
  --muted:#81766E;
  --white:#FBF8F5;

  --eng:"Cormorant Garamond",serif;
  --thai-title:"Noto Serif Thai",serif;
  --thai-body:"Noto Sans Thai",sans-serif;
  --kr:"Noto Sans KR",sans-serif;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--cream);
  color:var(--dark);
  font-family:var(--thai-body);
  overflow-x:hidden;
}

body.lang-en{
  font-family:var(--eng);
}

body.lang-ko{
  font-family:var(--kr);
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font-family:inherit;
}

section{
  position:relative;
}

.container{
  width:min(1180px,calc(100% - 48px));
  margin:auto;
}

.section{
  padding:130px 0;
}

.section-label{
  font-family:var(--eng);
  font-size:13px;
  letter-spacing:.28em;
  color:var(--taupe);
  margin-bottom:22px;
  text-transform:uppercase;
}

.section-title{
  font-family:var(--thai-title);
  font-size:clamp(34px,5vw,65px);
  font-weight:400;
  line-height:1.18;
  letter-spacing:-.02em;
}

.section-text{
  color:var(--muted);
  font-size:15px;
  line-height:2;
}


/* =========================
   NAV
========================= */

.nav-wrap{
  position:fixed;
  top:24px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 48px);
  max-width:1180px;
  z-index:1000;
}

.nav{
  height:64px;
  padding:8px 10px 8px 22px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(251,248,245,.86);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border:1px solid rgba(140,126,116,.18);
  border-radius:999px;
}

.logo{
  font-family:var(--eng);
  font-size:23px;
  font-weight:600;
  letter-spacing:.13em;
  white-space:nowrap;
}

.logo span{
  color:var(--taupe);
}

.nav-links{
  display:flex;
  align-items:center;
  gap:4px;
}

.nav-links a{
  font-family:var(--thai-body);
  font-size:13px;
  color:var(--muted);
  padding:10px 17px;
  border-radius:999px;
  transition:.3s ease;
}

.nav-links a:hover{
  color:var(--taupe);
}

.nav-links a.active{
  background:var(--beige);
  color:var(--taupe);
  font-weight:500;
}

.lang-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:var(--taupe);
  color:#fff;
  font-size:17px;
  cursor:pointer;
  transition:.3s ease;
}

.lang-btn:hover{
  transform:rotate(8deg);
}


/* =========================
   LANGUAGE MODAL
========================= */

.language-modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(64,57,52,.28);
  backdrop-filter:blur(8px);

  z-index:2000;
}

.language-modal.show{
  display:flex;
}

.language-box{
  width:min(390px,calc(100% - 40px));

  background:var(--white);

  border-radius:28px;

  padding:38px 30px 30px;

  text-align:center;

  box-shadow:
    0 25px 80px rgba(64,57,52,.15);
}

.language-box h3{
  font-family:var(--thai-title);
  font-size:24px;
  font-weight:500;
  margin-bottom:25px;
}

.language-option{
  width:100%;

  border:1px solid rgba(140,126,116,.18);

  background:transparent;

  border-radius:16px;

  padding:15px;

  margin-bottom:10px;

  font-family:var(--thai-body);
  font-size:14px;

  cursor:pointer;

  transition:.25s ease;
}

.language-option:hover{
  background:var(--beige);
  border-color:var(--warm);
  color:var(--taupe);
}


/* =========================
   HERO
========================= */

.hero{
  min-height:100vh;

  padding:130px 0 90px;

  display:flex;
  align-items:center;
}

.hero-grid{
  width:min(1180px,calc(100% - 48px));

  margin:auto;

  display:grid;

  grid-template-columns:.9fr 1.1fr;

  gap:90px;

  align-items:center;
}

.hero-copy{
  padding-left:20px;
}

.hero-kicker{
  display:block;

  margin-bottom:30px;

  font-family:var(--eng);

  font-size:12px;

  line-height:1;

  letter-spacing:.30em;

  color:var(--taupe);

  text-transform:uppercase;
}

.hero-title{
  font-family:var(--thai-title);

  font-size:clamp(62px,9vw,130px);

  font-weight:400;

  line-height:.95;

  letter-spacing:-.06em;

  color:var(--dark);
}

.hero-brand{
  margin-top:24px;

  font-family:var(--eng);

  font-size:18px;

  letter-spacing:.28em;

  color:var(--taupe);
}

.hero-desc{
  max-width:460px;

  margin-top:35px;

  font-size:15px;

  line-height:2;

  color:var(--muted);
}

.hero-image{
  position:relative;

  width:100%;

  max-width:570px;

  justify-self:end;

  aspect-ratio:4/5;

  overflow:hidden;

  border-radius:180px 180px 24px 24px;

  background:var(--beige);
}

.hero-image img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.image-placeholder{
  position:absolute;

  inset:0;

  display:none;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  color:var(--taupe);

  text-align:center;
}

.image-placeholder .thai{
  font-family:var(--thai-title);
  font-size:42px;
}

.image-placeholder .eng{
  font-family:var(--eng);
  font-size:18px;
  letter-spacing:.25em;
}


/* =========================
   ABOUT
========================= */

.about{
  background:var(--white);
}

.about-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:100px;

  align-items:center;
}

.about-slider{
  position:relative;

  width:100%;

  aspect-ratio:4/3;

  overflow:hidden;

  border-radius:24px;

  background:var(--beige);
}

.about-track{
  display:flex;

  width:600%;

  height:100%;

  transition:
    transform .7s cubic-bezier(.65,0,.35,1);
}

.about-slide{
  width:calc(100% / 6);

  height:100%;

  flex:0 0 calc(100% / 6);
}

.about-slide img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

.about-copy{
  max-width:500px;
}

.about-copy .section-title{
  margin-bottom:28px;
}

.about-copy .section-text{
  margin-bottom:24px;
}

.about-small{
  font-family:var(--eng);

  font-size:14px;

  letter-spacing:.18em;

  color:var(--taupe);
}


/* =========================
   WORKS
========================= */

.works{
  background:var(--cream);
}

.works-header{
  display:flex;

  justify-content:space-between;

  align-items:end;

  gap:40px;

  margin-bottom:65px;
}

.works-intro{
  max-width:430px;
}

.work-grid{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:20px;
}

.work-card{
  min-height:430px;

  background:var(--white);

  border-radius:24px;

  padding:34px;

  display:flex;

  flex-direction:column;

  justify-content:space-between;

  border:1px solid rgba(140,126,116,.10);

  transition:
    transform .35s ease,
    box-shadow .35s ease;
}

.work-card:hover{
  transform:translateY(-7px);

  box-shadow:
    0 20px 50px rgba(140,126,116,.10);
}

.work-number{
  font-family:var(--eng);

  font-size:16px;

  color:var(--taupe);
}

.work-card h3{
  font-family:var(--thai-title);

  font-size:29px;

  font-weight:500;

  margin-bottom:13px;
}

.work-card p{
  color:var(--muted);

  font-size:14px;

  line-height:1.9;
}

.work-link{
  font-family:var(--eng);

  font-size:15px;

  letter-spacing:.12em;

  color:var(--taupe);
}


/* =========================
   FEATURES
========================= */

.features{
  background:var(--white);
}

.features-grid{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:1px;

  border:1px solid rgba(140,126,116,.12);

  margin-top:60px;
}

.feature{
  min-height:260px;

  padding:35px;

  background:var(--white);

  border:1px solid rgba(140,126,116,.12);
}

.feature-number{
  font-family:var(--eng);

  color:var(--taupe);

  font-size:15px;
}

.feature h3{
  margin-top:50px;

  font-family:var(--thai-title);

  font-size:25px;

  font-weight:500;
}

.feature p{
  margin-top:12px;

  color:var(--muted);

  font-size:13px;

  line-height:1.9;
}


/* =========================
   PRICING
========================= */

.pricing{
  background:var(--cream);
}

.price-box{
  max-width:900px;

  margin:auto;

  padding:70px;

  background:var(--white);

  border-radius:35px;

  border:1px solid rgba(140,126,116,.10);

  text-align:center;
}

.price-label{
  font-family:var(--eng);

  color:var(--taupe);

  font-size:13px;

  letter-spacing:.25em;
}

.price{
  margin-top:12px;

  font-family:var(--eng);

  font-size:92px;

  line-height:1;

  color:var(--dark);
}

.price small{
  font-family:var(--thai-body);

  font-size:16px;

  color:var(--muted);
}

.price-desc{
  max-width:560px;

  margin:25px auto 0;

  color:var(--muted);

  font-size:14px;

  line-height:2;
}


/* =========================
   HOW IT WORKS
========================= */

.how{
  background:var(--white);
}

.steps{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:70px;

  margin-top:70px;
}

.step-number{
  font-family:var(--eng);

  font-size:44px;

  color:var(--taupe);
}

.step h3{
  margin-top:15px;

  font-family:var(--thai-title);

  font-size:24px;

  font-weight:500;
}

.step p{
  margin-top:12px;

  color:var(--muted);

  font-size:14px;

  line-height:1.9;
}


/* =========================
   FINAL
========================= */

.final-about{
  background:var(--cream);
}

.final-about-inner{
  max-width:850px;

  margin:auto;

  text-align:center;
}

.final-about-inner .section-text{
  margin-top:30px;
}

.signature{
  margin-top:38px;

  font-family:var(--eng);

  font-size:24px;

  letter-spacing:.15em;

  color:var(--taupe);
}


/* =========================
   CTA
========================= */

.cta{
  padding:110px 0;

  background:var(--beige);

  text-align:center;
}

.cta h2{
  font-family:var(--thai-title);

  font-size:clamp(35px,5vw,65px);

  font-weight:400;
}

.cta p{
  margin:20px auto 30px;

  max-width:560px;

  color:var(--taupe);

  font-size:14px;

  line-height:2;
}

.cta-button{
  display:inline-flex;

  align-items:center;

  justify-content:center;

  min-width:170px;

  padding:15px 25px;

  border-radius:999px;

  background:var(--taupe);

  color:white;

  font-family:var(--thai-body);

  font-size:13px;

  transition:.3s ease;
}

.cta-button:hover{
  transform:translateY(-3px);

  background:var(--dark);
}


/* =========================
   FOOTER
========================= */

footer{
  padding:40px 0;

  background:var(--taupe);

  color:rgba(255,255,255,.72);
}

.footer-inner{
  width:min(1180px,calc(100% - 48px));

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;
}

.footer-brand{
  font-family:var(--eng);

  font-size:19px;

  letter-spacing:.2em;

  color:white;
}

.footer-copy{
  font-size:11px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .nav-wrap{
    width:calc(100% - 24px);
    top:12px;
  }

  .nav{
    padding-left:17px;
  }

  .nav-links{
    display:none;
  }

  .hero{
    padding-top:120px;
  }

  .hero-grid{
    grid-template-columns:1fr;
    gap:55px;
  }

  .hero-copy{
    padding-left:0;
  }

  .hero-image{
    justify-self:center;
    max-width:600px;
  }

  .about-grid{
    grid-template-columns:1fr;
    gap:55px;
  }

  .about-copy{
    max-width:none;
  }

  .work-grid{
    grid-template-columns:1fr;
  }

  .features-grid{
    grid-template-columns:1fr;
  }

  .steps{
    grid-template-columns:1fr;
    gap:45px;
  }

  .works-header{
    display:block;
  }

  .works-intro{
    margin-top:25px;
  }

  .price-box{
    padding:50px 25px;
  }

  .price{
    font-size:72px;
  }

  .section{
    padding:100px 0;
  }
}

@media(max-width:520px){

  .container{
    width:calc(100% - 32px);
  }

  .hero-grid{
    width:calc(100% - 32px);
  }

  .hero-title{
    font-size:70px;
  }

  .hero-kicker{
    margin-bottom:32px;
  }

  .hero-image{
    border-radius:120px 120px 20px 20px;
  }

  .about-slider{
    aspect-ratio:4/3;
    border-radius:18px;
  }

  .section-title{
    font-size:38px;
  }

  .work-card{
    min-height:360px;
  }

  .feature{
    min-height:220px;
  }

  .footer-inner{
    flex-direction:column;
    text-align:center;
  }

}

</style>
</head>

/* =========================
   ACTIVE NAV
========================= */

const navLinks =
document.querySelectorAll(
".nav-links a"
);

const sections = [

document.getElementById("home"),

document.getElementById("about"),

document.getElementById("works"),

document.getElementById("features"),

document.getElementById("pricing"),

document.getElementById("how")

];


function updateActiveNav(){

let current="home";

const scrollPosition =
window.scrollY +
window.innerHeight*.35;


sections.forEach(section=>{

if(
scrollPosition >=
section.offsetTop
){
  current=section.id;
}

});


navLinks.forEach(link=>{

link.classList.remove(
"active"
);

if(
link.dataset.nav===current
){

link.classList.add(
"active"
);

}

});

}


window.addEventListener(
"scroll",
updateActiveNav
);

updateActiveNav();


/* =========================
   ABOUT SLIDER
========================= */

const aboutTrack =
document.getElementById(
"aboutTrack"
);

let currentSlide=0;

const totalSlides=6;


function nextAboutSlide(){

currentSlide++;

if(
currentSlide>=totalSlides
){
  currentSlide=0;
}

aboutTrack.style.transform =
`translateX(-${
currentSlide*(100/totalSlides)
}%)`;

}


setInterval(
nextAboutSlide,
1500
);

</script>
